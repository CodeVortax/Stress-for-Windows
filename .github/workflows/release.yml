name: Build and Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Work out version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (compile check)
        run: dotnet build WindowsStress -c Release -p:Version=${{ steps.ver.outputs.version }}

      - name: Publish single-file executable
        run: >
          dotnet publish WindowsStress -c Release
          -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:DebugSymbols=false
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/${{ matrix.rid }}

      - name: Package
        run: |
          cp README.md LICENSE publish/${{ matrix.rid }}/
          cd publish/${{ matrix.rid }}
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            zip -q ../../WindowsStress-${{ matrix.rid }}.zip WindowsStress.exe README.md LICENSE
          else
            tar czf ../../WindowsStress-${{ matrix.rid }}.tar.gz WindowsStress README.md LICENSE
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: WindowsStress-${{ matrix.rid }}
          path: |
            WindowsStress-${{ matrix.rid }}.zip
            WindowsStress-${{ matrix.rid }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
